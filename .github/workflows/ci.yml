name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install
        working-directory: tools
        run: npm ci

      - name: Syntax check
        working-directory: tools
        run: npm run syntax-check

      - name: Install Playwright browser (for integration tests)
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        working-directory: tools
        run: npm run test:unit

      - name: Integration tests
        working-directory: tools
        run: npm run test:integration

      - name: Version flag sanity
        working-directory: tools
        run: |
          for s in audit-all audit-axe audit-capture audit-diff audit-discover audit-iba audit-lighthouse audit-manual-guide audit-merge audit-pa11y audit-report; do
            node $s.mjs --version
          done
